server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and sets X-Forwarded-For. Only trust it from the
    # docker bridge ranges — the container is reachable on tandem-proxy alone,
    # but this keeps a spoofed header from a misconfigured peer out of the logs.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # NOTE on add_header: a location that declares any add_header drops every
    # header inherited from this server block. So each location below repeats
    # the full set rather than relying on inheritance. Traefik already adds
    # HSTS / nosniff / referrer-policy for this router; only what it does not
    # set lives here.

    # Content-hashed bundles emitted by Vite — safe to cache forever. Longest
    # matching prefix wins, so this beats "location /" for /assets/*.
    location /assets/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # $uri/ resolves /products/ and /impact/ to their index.html — Vite
        # emits those as separate multi-page entries.
        try_files $uri $uri/ =404;

        # HTML must never be cached: it carries the hashed asset URLs, so a
        # stale copy points at bundles that no longer exist after a deploy.
        # This also covers favicon.svg / icons.svg from public/, which are
        # unhashed and therefore must revalidate too.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;

        # Unknown paths render the homepage. Scoped to this location so a
        # missing /assets/* file still returns a plain 404 instead of HTML.
        error_page 404 /index.html;
    }
}
