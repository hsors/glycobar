name: deploy-ovh

# Builds the static site and uploads dist/ to the OVH web hosting over SFTP
# (SSH, port 22), on every push to main. The OVH FTP server does not offer
# FTPS, so plain FTP is not used: it would send the password in clear text.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#
#   OVH_FTP_HOST      SSH/SFTP server of the hosting, e.g. ssh.cluster110.hosting.ovh.net
#   OVH_FTP_USER      FTP/SSH login (SSH access must be enabled for it in the OVH Manager)
#   OVH_FTP_PASSWORD  its password
#   OVH_FTP_DIR       (optional) root folder of the site on the hosting, default "www"
#
# Until the three required secrets exist the job still builds the site (so a
# broken build is caught) and skips the upload without failing.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time: a second push waits instead of uploading in parallel
concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/.htaccess

      - name: Check OVH secrets
        id: ovh
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          FTP_USER: ${{ secrets.OVH_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          if [ -z "${FTP_HOST:-}" ] || [ -z "${FTP_USER:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "OVH secrets are not configured (OVH_FTP_HOST / OVH_FTP_USER / OVH_FTP_PASSWORD): upload skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: steps.ovh.outputs.configured == 'true'
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends lftp
          fi
          lftp --version | head -n 1

      - name: Upload to OVH
        if: steps.ovh.outputs.configured == 'true'
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          FTP_USER: ${{ secrets.OVH_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.OVH_FTP_DIR }}
        run: |
          set -uo pipefail

          # Secrets pasted from a web page often carry a trailing space or
          # newline, or a "sftp://" prefix: clean the usual slips up.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          FTP_HOST="$(trim "$FTP_HOST")"
          FTP_HOST="${FTP_HOST#sftp://}"
          FTP_HOST="${FTP_HOST#ftp://}"
          FTP_HOST="${FTP_HOST%%/*}"
          FTP_USER="$(trim "$FTP_USER")"
          FTP_PASSWORD="${FTP_PASSWORD%$'\n'}"
          FTP_PASSWORD="${FTP_PASSWORD%$'\r'}"
          REMOTE_DIR="$(trim "${FTP_DIR:-www}")"
          REMOTE_DIR="${REMOTE_DIR#/}"
          REMOTE_DIR="${REMOTE_DIR%/}"
          [ -n "$REMOTE_DIR" ] || REMOTE_DIR=www

          # A host name is letters, digits, dots and dashes (and an optional :port).
          if ! [[ "$FTP_HOST" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            # hex codes, so an invisible character shows up (20 = space, 0d/0a = line break)
            bad="$(printf '%s' "$FTP_HOST" | tr -d 'A-Za-z0-9.:-' | od -An -tx1 | tr -s ' \n' ' ' | cut -c1-80)"
            echo "::error title=OVH_FTP_HOST is not a valid host name::length ${#FTP_HOST}, unexpected characters (hex):${bad:- none}. Expected something like ssh.cluster110.hosting.ovh.net (no spaces, no sftp://, no path)."
            exit 1
          fi
          echo "Host name looks valid (${#FTP_HOST} characters), user length ${#FTP_USER}, remote dir '${REMOTE_DIR}'."

          # The password never goes into this file: it is passed with -u below.
          # The OVH host key is accepted on first contact (the runner is a fresh
          # machine every time, so there is no known_hosts to compare with).
          cat > /tmp/deploy.lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set sftp:auto-confirm yes
          cd ${REMOTE_DIR}

          # 1. new hashed bundles and images first, so the pages never point at
          #    files that are not there yet
          mirror -R --verbose --parallel=4 dist/assets assets

          # 2. the pages that reference them
          mirror -R --verbose dist/products products
          mirror -R --verbose dist/impact impact
          put dist/favicon.svg -o favicon.svg
          put dist/icons.svg -o icons.svg
          put dist/index.html -o index.html
          put dist/.htaccess -o .htaccess

          # 3. now that the new pages are live, drop the bundles nothing uses any more
          mirror -R --delete --verbose dist/assets assets
          bye
          EOF

          # GitHub runs this script with "bash -e": a failing lftp must not stop
          # it before the reason is printed, hence the "|| status=$?".
          status=0
          # -f is not accepted after the host name; -e runs the script once connected
          lftp -u "${FTP_USER},${FTP_PASSWORD}" -e "source /tmp/deploy.lftp" "sftp://${FTP_HOST}" > /tmp/lftp.out 2>&1 || status=$?
          rm -f /tmp/deploy.lftp
          cat /tmp/lftp.out

          if [ "$status" -ne 0 ]; then
            # surface the real reason in the run summary, where it can be read
            # without opening the raw log (the runner masks secret values)
            msg="$(tail -n 8 /tmp/lftp.out | tr '\n' ' ' | cut -c1-800)"
            echo "::error title=OVH upload failed (lftp exit ${status})::${msg}"
            exit "$status"
          fi

          echo "Deployed to ${REMOTE_DIR} on ${FTP_HOST}"
